<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dispensa Planejada - Checklist</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "emerald-green": "#059669",
                        "violet": "#7c3aed",
                        "deep-teal": "#0f766e",
                        "sapphire-blue": "#2563eb",
                        "rose-red": "#e11d48",
                        "soft-slate": "#f8fafc",
                        "pure-white": "#ffffff",
                        "near-black": "#0f172a",
                        "cool-gray": "#475569",
                        "amber": "#f59e0b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Public Sans"],
                        "display": ["Public Sans"],
                        "body": ["Public Sans"],
                        "label": ["Public Sans"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: theme('colors.soft-slate');
            font-family: 'Public Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .tabular-nums { font-variant-numeric: tabular-nums; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-near-black bg-soft-slate min-h-screen pb-40 pt-20">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-near-black/80 backdrop-blur-md border-b border-slate-100 dark:border-slate-800 shadow-sm flex items-center justify-between px-4 h-16 max-w-5xl mx-auto">
<button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-soft-slate active:translate-y-px transition-all duration-150">
<span class="material-symbols-outlined text-emerald-green">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<span class="text-deep-teal font-headline font-bold text-xl tracking-tight">Atacadão</span>
</div>
<div class="relative w-11 h-11 flex items-center justify-center">
<svg class="w-10 h-10 transform -rotate-90" viewbox="0 0 36 36">
<!-- Background Circle -->
<path class="text-slate-200" d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"></path>
<!-- Progress Circle -->
<path class="text-emerald-green" d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="33, 100" stroke-linecap="round" stroke-width="3"></path>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="text-[10px] font-bold text-emerald-green tabular-nums">1/3</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-3xl mx-auto px-4 sm:px-6 flex flex-col gap-8">
<!-- Category: MERCEARIA -->
<section>
<h2 class="font-headline font-bold text-sm text-cool-gray tracking-wider uppercase mb-3 px-1">Mercearia</h2>
<div class="bg-pure-white rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-slate-100 overflow-hidden">
<!-- Checked Item -->
<label class="flex items-start gap-4 p-4 opacity-40 transition-opacity cursor-pointer group">
<div class="pt-0.5">
<input checked="" class="w-7 h-7 rounded text-emerald-green focus:ring-emerald-green border-slate-300 transition-colors cursor-pointer" type="checkbox"/>
</div>
<div class="flex-1">
<div class="flex justify-between items-start mb-1">
<span class="font-medium text-lg line-through text-near-black">Arroz Integral Camil 1kg</span>
<span class="font-bold text-lg tabular-nums text-cool-gray line-through">R$ 8,49</span>
</div>
<div class="inline-flex items-center px-2 py-0.5 rounded-full bg-slate-100 text-cool-gray text-xs font-medium">
                            Qtd: 2
                        </div>
</div>
</label>
</div>
</section>
<!-- Category: LATICÍNIOS -->
<section>
<h2 class="font-headline font-bold text-sm text-cool-gray tracking-wider uppercase mb-3 px-1">Laticínios</h2>
<div class="bg-pure-white rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-slate-100 overflow-hidden">
<!-- Unchecked Item -->
<label class="flex items-start gap-4 p-4 hover:bg-soft-slate transition-colors cursor-pointer group">
<div class="pt-0.5">
<input class="w-7 h-7 rounded text-emerald-green focus:ring-emerald-green border-slate-300 transition-colors cursor-pointer" type="checkbox"/>
</div>
<div class="flex-1">
<div class="flex justify-between items-start mb-1">
<span class="font-medium text-lg text-near-black group-hover:text-emerald-green transition-colors">Leite Integral Parmalat 1L</span>
<span class="font-bold text-lg tabular-nums text-near-black">R$ 5,99</span>
</div>
<div class="inline-flex items-center px-2 py-0.5 rounded-full bg-emerald-green/10 text-emerald-green text-xs font-medium">
                            Qtd: 3
                        </div>
</div>
</label>
</div>
</section>
<!-- Category: BEBIDAS QUENTES -->
<section>
<h2 class="font-headline font-bold text-sm text-cool-gray tracking-wider uppercase mb-3 px-1">Bebidas Quentes</h2>
<div class="bg-pure-white rounded-xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-slate-100 overflow-hidden">
<!-- Unchecked Item -->
<label class="flex items-start gap-4 p-4 hover:bg-soft-slate transition-colors cursor-pointer group">
<div class="pt-0.5">
<input class="w-7 h-7 rounded text-emerald-green focus:ring-emerald-green border-slate-300 transition-colors cursor-pointer" type="checkbox"/>
</div>
<div class="flex-1">
<div class="flex justify-between items-start mb-1">
<span class="font-medium text-lg text-near-black group-hover:text-emerald-green transition-colors">Café Pilão Torrado e Moído 500g</span>
<span class="font-bold text-lg tabular-nums text-near-black">R$ 14,79</span>
</div>
<div class="inline-flex items-center px-2 py-0.5 rounded-full bg-emerald-green/10 text-emerald-green text-xs font-medium">
                            Qtd: 1
                        </div>
</div>
</label>
</div>
</section>
</main>
<!-- Contextual Checkout Summary Bar (Replaces BottomNavBar for task context) -->
<div class="fixed bottom-0 w-full z-50 bg-pure-white shadow-[0_-8px_24px_rgba(0,0,0,0.08)] rounded-t-[1.5rem] border-t border-slate-100 p-4 pb-safe">
<div class="max-w-3xl mx-auto flex flex-col gap-4">
<div class="flex justify-between items-end px-2">
<div class="flex flex-col">
<span class="text-sm font-medium text-cool-gray">2 itens restantes</span>
<span class="font-headline font-bold text-2xl text-near-black tabular-nums">R$ 35,92</span>
</div>
<button class="h-12 px-6 rounded-xl font-bold text-emerald-green bg-emerald-green/10 hover:bg-emerald-green/20 active:scale-95 transition-all flex items-center justify-center">
                    Finalizar
                </button>
</div>
</div>
</div>
</body></html>
